name: gerrit_dashboard
description: Flutter web (Wasm) dashboard over the anonymous Gerrit REST API.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  gerrit_api:
    path: ../gerrit_api
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
